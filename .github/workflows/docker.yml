name: Docker
on:
  push:
    branches:
      - "master"
      - "staging"

env:
  ENVIRONMENT: ${{ github.ref_name == 'master' && 'prod' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'master' && 'hasuragres' || 'hasuragres-staging' }}

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@a115e2ad9226805cd2588dc6fa5b7775991b141a
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}=${{ github.sha }}
